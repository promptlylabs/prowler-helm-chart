# This is to override the chart name.
nameOverride: ""
# The prowler-ui Docker image has NEXT_PUBLIC_API_BASE_URL=http://prowler-api:8080/api/v1
# baked into the JS bundle at build time (NEXT_PUBLIC_* vars cannot be overridden at runtime).
# This means the API service MUST be named "prowler-api", which requires fullnameOverride: "prowler".
fullnameOverride: "prowler"

postgresql:
  # If enabled, it will create a Secret with the credentials.
  # Otherwise, create a secret with the following:
  # - POSTGRES_HOST
  # - POSTGRES_PORT
  # - POSTGRES_ADMIN_USER     - Existing user in charge of migrations, tables, permissions, RLS
  # - POSTGRES_ADMIN_PASSWORD
  # - POSTGRES_USER           - Will be created by ADMIN_USER
  # - POSTGRES_PASSWORD
  # - POSTGRES_DB             - Existing DB
  enabled: true
  # If set, the chart will NOT auto-create the PostgreSQL connection secret
  # and will reference this existing secret instead (e.g. from External Secrets Operator).
  # Required keys: POSTGRES_HOST, POSTGRES_PORT, POSTGRES_ADMIN_USER,
  #   POSTGRES_ADMIN_PASSWORD, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
  existingSecret: ""
  global:
    postgresql:
      auth:
        postgresPassword: postgres_password
        database: prowler_db

valkey:
  # If enabled, it will create a Secret with the credentials.
  # Otherwise, create a secret with
  # - VALKEY_HOST
  # - VALKEY_PORT
  # - VALKEY_PASSWORD
  # - VALKEY_DB
  enabled: true
  # If set, the chart will NOT auto-create the Valkey connection secret
  # and will reference this existing secret instead (e.g. from External Secrets Operator).
  # Required keys: VALKEY_HOST, VALKEY_PORT, VALKEY_PASSWORD, VALKEY_DB
  existingSecret: ""
  architecture: "standalone"
  auth:
    enabled: false
    # password: valkey_password

neo4j:
  # If enabled, it will create a Secret with the credentials.
  # Otherwise, create a secret with the following:
  # - NEO4J_HOST
  # - NEO4J_PORT
  # - NEO4J_USER
  # - NEO4J_PASSWORD
  enabled: true
  # If set, the chart will NOT auto-create the Neo4j connection secret
  # and will reference this existing secret instead (e.g. from External Secrets Operator).
  # Required keys: NEO4J_HOST, NEO4J_PORT, NEO4J_USER, NEO4J_PASSWORD
  existingSecret: ""
  fullnameOverride: "prowler-neo4j"
  neo4j:
    name: "prowler-neo4j"
    password: "neo4j_password"
    # Enable APOC plugin
    plugins:
      - apoc
    config:
      dbms.security.procedures.allowlist: "apoc.*"
      server.memory.pagecache.size: "1G"
      server.memory.heap.initial_size: "1G"
      server.memory.heap.max_size: "1G"
  volumes:
    data:
      mode: defaultStorageClass

ui:
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 2

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: prowlercloud/prowler-ui
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  # This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  # If set, the chart won't create the auth secret and will reference this existing secret instead.
  # Required key: AUTH_SECRET (obtain from `openssl rand -base64 32`)
  authSecret:
    existingSecret: ""

  podSecurityContext:
    fsGroup: 1001

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 3000

  # This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/gateway/
  gatewayAPI:
    httpRoute:
      enabled: false
      annotations: {}
      parentRefs:
        - name: gateway
          namespace: ""
          sectionName: ""
      hostnames:
        - prowler-ui.cluster.local
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /sign-in
      port: http
  readinessProbe:
    httpGet:
      path: /sign-in
      port: http

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}

api:  
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 2

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: prowlercloud/prowler-api
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # Shared with celery-worker and celery-beat
  djangoConfig:
    # API scan settings
    # The path to the directory where scan output should be stored
    DJANGO_TMP_OUTPUT_DIRECTORY: "/tmp/prowler_api_output"
    # The maximum number of findings to process in a single batch
    DJANGO_FINDINGS_BATCH_SIZE: "1000"
    # Django settings
    DJANGO_ALLOWED_HOSTS: "*"
    DJANGO_BIND_ADDRESS: "0.0.0.0"
    DJANGO_PORT: "8080"
    DJANGO_DEBUG: "False"
    DJANGO_SETTINGS_MODULE: "config.django.production"
    # Select one of [ndjson|human_readable]
    DJANGO_LOGGING_FORMATTER: "ndjson"
    # Select one of [DEBUG|INFO|WARNING|ERROR|CRITICAL]
    # Applies to both Django and Celery Workers
    DJANGO_LOGGING_LEVEL: "INFO"
    # Defaults to the maximum available based on CPU cores if not set.
    DJANGO_WORKERS: "4"
    # Token lifetime is in minutes
    DJANGO_ACCESS_TOKEN_LIFETIME: "30"
    # Token lifetime is in minutes
    DJANGO_REFRESH_TOKEN_LIFETIME: "1440"
    DJANGO_CACHE_MAX_AGE: "3600"
    DJANGO_STALE_WHILE_REVALIDATE: "60"
    DJANGO_MANAGE_DB_PARTITIONS: "True"
    DJANGO_BROKER_VISIBILITY_TIMEOUT: "86400"
    DJANGO_THROTTLE_TOKEN_OBTAIN: "50/minute"
    TASK_RETRY_DELAY_SECONDS: "0.1"
    TASK_RETRY_ATTEMPTS: "5"
    # Attack Paths / Neo4j settings
    ATTACK_PATHS_BATCH_SIZE: "1000"
    ATTACK_PATHS_SERVICE_UNAVAILABLE_MAX_RETRIES: "3"
    ATTACK_PATHS_READ_QUERY_TIMEOUT_SECONDS: "30"
    ATTACK_PATHS_MAX_CUSTOM_QUERY_NODES: "250"
    # S3 Output settings (optional)
    # DJANGO_OUTPUT_S3_AWS_ACCESS_KEY_ID: ""
    # DJANGO_OUTPUT_S3_AWS_SECRET_ACCESS_KEY: ""
    # DJANGO_OUTPUT_S3_AWS_SESSION_TOKEN: ""
    # DJANGO_OUTPUT_S3_AWS_DEFAULT_REGION: ""
    # DJANGO_OUTPUT_S3_AWS_OUTPUT_BUCKET: ""
    #
    # Sentry (optional)
    # DJANGO_SENTRY_DSN: ""
    #
    # SAML SSO (optional) - see https://docs.prowler.com/user-guide/tutorials/prowler-app-sso
    # SAML_SSO_CALLBACK_URL: "https://api.example.com/api/v1/saml/acs"
    #
    # Social login (optional) - add OAuth credentials via api.secrets
    # SOCIAL_GOOGLE_OAUTH_CLIENT_ID, SOCIAL_GOOGLE_OAUTH_CLIENT_SECRET
    # SOCIAL_GITHUB_OAUTH_CLIENT_ID, SOCIAL_GITHUB_OAUTH_CLIENT_SECRET
  djangoConfigKeys:
    # Create secret with Django Keys
    # If false, a secret needs to be created with the following:
    # - DJANGO_TOKEN_SIGNING_KEY - obtain from `openssl genrsa -out private.pem 2048`
    # - DJANGO_TOKEN_VERIFYING_KEY - obtain from `openssl rsa -in private.pem -pubout -out public.pem`
    # - DJANGO_SECRETS_ENCRYPTION_KEY - obtain from `openssl rand -base64 32`
    create: true
  
  # Secret names to be used as env vars.
  secrets: []
    # - "prowler-api-keys"

  command:
    - /home/prowler/docker-entrypoint.sh
  args:
    - prod

  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  
  # This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext:
    fsGroup: 1000

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 8080

  # This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  startupProbe:
    httpGet:
      path: /api/v1/docs
      port: http
    failureThreshold: 30
    periodSeconds: 10

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    failureThreshold: 10
    httpGet:
      path: /api/v1/docs
      port: http
    periodSeconds: 20
  readinessProbe:
    failureThreshold: 10
    httpGet:
      path: /api/v1/docs
      port: http
    periodSeconds: 20

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}

worker:  
