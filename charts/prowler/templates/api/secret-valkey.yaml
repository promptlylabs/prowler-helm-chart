{{- if and .Values.valkey.enabled (not .Values.valkey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prowler.fullname" . }}-api-valkey
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
type: Opaque
stringData:
  VALKEY_HOST: "{{ printf "%s-headless" (include "common.names.fullname" .Subcharts.valkey) }}"
  # VALKEY_PASSWORD: "valkey_password"
  VALKEY_PORT: "6379"
  VALKEY_DB: "0"
  # Optional broker TLS/auth (added in 5.x); uncomment for managed Valkey/ElastiCache:
  # VALKEY_SCHEME: "rediss"
  # VALKEY_USERNAME: "default"
{{- end -}}